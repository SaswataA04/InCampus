
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campus GPS - Kalman Filter + Plus Codes</title>

<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html, body {
  height: 100%;
  width: 100%;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

#map {
  height: 100%;
  width: 100%;
}

/* GPS STATUS */

.status {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);

  background: #020617;
  color: white;

  padding: 12px 18px;
  border-radius: 10px;

  font-size: 14px;
  font-weight: bold;

  z-index: 9999;
  white-space: nowrap;

  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* INFORMATION PANEL */

.info {
  position: fixed;
  top: 15px;
  left: 15px;

  background: rgba(2, 6, 23, 0.92);
  color: white;

  padding: 14px;
  border-radius: 10px;

  z-index: 9999;
  font-size: 13px;
  line-height: 1.7;

  max-width: 230px;
}

.info strong {
  color: #60a5fa;
}

/* GPS MARKER */

.leaflet-marker-icon {
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

</style>

</head>

<body>

<!-- MAP -->

<div id="map"></div>

<!-- INFORMATION PANEL -->

<div class="info">

  <strong>Campus GPS Tracker</strong>

  <div id="gpsAccuracy">Accuracy: Waiting...</div>

  <div id="coordinates">Coordinates: Waiting...</div>

  <div id="boundaryCount">Boundary: Loading...</div>

  <div id="filterStatus">Kalman: Active</div>

</div>

<!-- STATUS -->

<div id="status" class="status">
  Waiting for GPS...
</div>


<!-- LEAFLET -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- OPEN LOCATION CODE LIBRARY -->

<script src="https://unpkg.com/open-location-code@1.0.3/openlocationcode.js"></script>


<script>

/* =====================================================
   1. MAP INITIALIZATION
===================================================== */

const referenceLat = 22.7378;
const referenceLng = 88.4565;

const map = L.map('map').setView(
  [referenceLat, referenceLng],
  17
);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 20,
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);


/* =====================================================
   2. CAMPUS BOUNDARY - PLUS CODES
===================================================== */

// Short Plus Codes supplied for the campus boundary.
// Their order is preserved.
// Repeated closing point and consecutive duplicate removed.

const campusBoundaryPlusCodes = [

  "PFR4+7X7",
  "PFR4+8V9",
  "PFR4+9RM",
  "PFR4+CPQ",
  "PFR4+9PF",
  "PFR4+8PF",
  "PFR4+7PF",
  "PFR4+6PF",
  "PFR4+5P7",
  "PFR4+3P3",
  "PFR4+2P2",

  "PFQ4+WP2",
  "PFQ4+RPR",
  "PFQ4+QPJ",
  "PFQ4+MPR",
  "PFQ4+HMP",
  "PFQ4+HJH",
  "PFQ4+HHG",
  "PFQ4+HFH",
  "PFQ4+HCF",
  "PFQ4+H6H",
  "PFQ4+H3J",
  "PFQ4+P29",
  "PFQ4+R2H",

  "PFQ3+WXW",
  "PFQ3+QRQ",
  "PFQ3+PRH",
  "PFQ3+MMH",
  "PFQ3+JG6",
  "PFQ3+H72",
  "PFQ3+J6R",
  "PFQ3+J52",
  "PFQ3+C66",
  "PFQ3+768",
  "PFQ3+38R",
  "PFQ3+2CX",

  "PFP3+VF9",
  "PFP3+PHX",
  "PFP3+MGC",
  "PFP3+HF9",
  "PFP3+FF4",
  "PFP3+CH4",
  "PFP3+CQF",
  "PFP3+CW5",

  "PFP4+93P",
  "PFP4+84G",
  "PFP4+868",
  "PFP4+66W",
  "PFP4+65J",
  "PFP4+52R",
  "PFP4+32F",
  "PFP4+38R",
  "PFP4+388",

  "PFM4+XCG",
  "PFM4+WF2",
  "PFM4+WJM",
  "PFM4+XRJ",

  "PFP4+3X8",
  "PFP5+54H",
  "PFP5+84Q",
  "PFP4+HXQ",

  "PFP5+P6H",
  "PFP5+W6Q",

  "PFQ5+27V",
  "PFQ5+77F",
  "PFQ5+H6X",
  "PFQ5+P65",
  "PFQ5+P9F",

  "PFR5+283",
  "PFR5+53C"

];


/* =====================================================
   3. CONVERT PLUS CODES TO LATITUDE AND LONGITUDE
===================================================== */

function convertPlusCodes(codes) {

  return codes.map((code, index) => {

    try {

      const fullCode = OpenLocationCode.recoverNearest(
        code,
        referenceLat,
        referenceLng
      );

      const decoded = OpenLocationCode.decode(fullCode);

      return {

        code: code,

        fullCode: fullCode,

        lat: decoded.latitudeCenter,

        lng: decoded.longitudeCenter,

        index: index + 1

      };

    } catch (error) {

      console.error(
        "Plus Code conversion failed:",
        code,
        error
      );

      throw error;

    }

  });

}

let decodedBoundary;

try {

  decodedBoundary = convertPlusCodes(
    campusBoundaryPlusCodes
  );

} catch (error) {

  document.getElementById('status').innerText =
    'BOUNDARY CONVERSION ERROR';

  throw error;

}


// Leaflet requires [latitude, longitude]

const campusBoundary = decodedBoundary.map(point => [
  point.lat,
  point.lng
]);


/* =====================================================
   4. DRAW CAMPUS POLYGON
===================================================== */

const campusPolygon = L.polygon(campusBoundary, {

  color: '#1e3a8a',

  weight: 3,

  fillColor: '#3b82f6',

  fillOpacity: 0.15

}).addTo(map);


// Show boundary vertices

const boundaryMarkers = L.layerGroup();

decodedBoundary.forEach(point => {

  L.circleMarker(
    [point.lat, point.lng],
    {

      radius: 3,

      color: '#dc2626',

      fillColor: '#ef4444',

      fillOpacity: 1,

      weight: 1

    }

  )
  .bindTooltip(
    `Point ${point.index}: ${point.code}`
  )
  .addTo(boundaryMarkers);

});

boundaryMarkers.addTo(map);


// Fit map to boundary

map.fitBounds(
  campusPolygon.getBounds(),
  {
    padding: [35, 35]
  }
);


// Boundary information

document.getElementById('boundaryCount').innerText =
  `Boundary points: ${campusBoundary.length}`;


// Log decoded coordinates for verification

console.table(decodedBoundary);


/* =====================================================
   5. CUSTOM GPS MARKER
===================================================== */

const userIcon = L.icon({

  iconUrl:
  'https://static.vecteezy.com/system/resources/thumbnails/029/166/580/small/icon-location-map-ai-generative-png.png',

  iconSize: [42, 42],

  iconAnchor: [21, 42]

});


const userMarker = L.marker(
  [referenceLat, referenceLng],
  {
    icon: userIcon
  }
).addTo(map);


// GPS accuracy circle

const accuracyCircle = L.circle(
  [referenceLat, referenceLng],
  {

    radius: 0,

    color: '#2563eb',

    fillColor: '#60a5fa',

    fillOpacity: 0.12,

    weight: 1

  }
).addTo(map);


/* =====================================================
   6. KALMAN FILTER
===================================================== */

class Kalman1D {

  constructor(r = 0.00001, q = 0.0003) {

    this.r = r;

    this.q = q;

    this.p = 1;

    this.x = null;

  }


  filter(z) {

    if (this.x === null) {

      this.x = z;

      return z;

    }

    this.p += this.q;

    const k = this.p / (this.p + this.r);

    this.x += k * (z - this.x);

    this.p *= (1 - k);

    return this.x;

  }

}


const kLat = new Kalman1D();

const kLng = new Kalman1D();


/* =====================================================
   7. POINT-IN-POLYGON DETECTION
===================================================== */

// Returns true when GPS point is inside the polygon.

function isInsideCampus(point, polygon) {

  const lat = point[0];

  const lng = point[1];

  let inside = false;

  for (
    let i = 0, j = polygon.length - 1;
    i < polygon.length;
    j = i++
  ) {

    const xi = polygon[i][1];

    const yi = polygon[i][0];

    const xj = polygon[j][1];

    const yj = polygon[j][0];


    const intersect =

      ((yi > lat) !== (yj > lat)) &&

      (
        lng <
        (xj - xi) * (lat - yi) / (yj - yi) + xi
      );


    if (intersect) {

      inside = !inside;

    }

  }

  return inside;

}


/* =====================================================
   8. GPS STATUS
===================================================== */

const statusElement = document.getElementById('status');

function updateStatus(message, color) {

  statusElement.innerText = message;

  statusElement.style.background = color;

}


/* =====================================================
   9. GPS TRACKING - RAW + KALMAN
===================================================== */

if (!navigator.geolocation) {

  updateStatus(
    'GPS NOT SUPPORTED BY THIS BROWSER',
    '#991b1b'
  );

} else {

  navigator.geolocation.watchPosition(

    function(position) {

      // RAW GPS DATA

      const rawLat = position.coords.latitude;

      const rawLng = position.coords.longitude;

      const accuracy = Math.round(
        position.coords.accuracy
      );


      // KALMAN FILTER

      const lat = kLat.filter(rawLat);

      const lng = kLng.filter(rawLng);


      // FILTERED LOCATION

      const filteredPosition = [lat, lng];


      // UPDATE MARKER

      userMarker.setLatLng(filteredPosition);


      // UPDATE ACCURACY CIRCLE

      accuracyCircle.setLatLng(filteredPosition);

      accuracyCircle.setRadius(accuracy);


      // CAMPUS GEOFENCING

      const inside = isInsideCampus(
        filteredPosition,
        campusBoundary
      );


      // UPDATE STATUS

      if (inside) {

        updateStatus(
          `INSIDE CAMPUS | ±${accuracy}m`,
          '#166534'
        );

      } else {

        updateStatus(
          `OUTSIDE CAMPUS | ±${accuracy}m`,
          '#991b1b'
        );

      }


      // UPDATE INFORMATION PANEL

      document.getElementById('gpsAccuracy').innerText =
        `Accuracy: ±${accuracy} metres`;

      document.getElementById('coordinates').innerText =
        `Coordinates: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;

      document.getElementById('filterStatus').innerText =
        'Kalman: Active';


      console.log({

        rawLatitude: rawLat,

        rawLongitude: rawLng,

        filteredLatitude: lat,

        filteredLongitude: lng,

        accuracy: accuracy,

        campusStatus: inside ? 'INSIDE' : 'OUTSIDE'

      });

    },


    // GPS ERROR HANDLING

    function(error) {

      let message = '';

      switch (error.code) {

        case error.PERMISSION_DENIED:

          message = 'GPS PERMISSION DENIED';

          break;

        case error.POSITION_UNAVAILABLE:

          message = 'GPS POSITION UNAVAILABLE';

          break;

        case error.TIMEOUT:

          message = 'GPS REQUEST TIMEOUT';

          break;

        default:

          message = 'UNKNOWN GPS ERROR';

      }


      updateStatus(
        message,
        '#991b1b'
      );

      console.error(error);

    },


    // GPS OPTIONS

    {

      enableHighAccuracy: true,

      maximumAge: 0,

      timeout: 15000

    }

  );

}

</script>

</body>
</html>
