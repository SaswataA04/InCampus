<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Campus GPS – Kalman Stage</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body { height:100%; margin:0; }
#map { height:100%; width:100%; }
.status {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: #020617;
  color: #e5e7eb;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 999;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="status" class="status">Waiting for GPS…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================
   MAP
========================= */
const map = L.map('map').setView([22.7378, 88.4565], 17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 20
}).addTo(map);

/* =========================
   CAMPUS BOUNDARY
========================= */
const campusBoundary = [/* same coordinates as before */ 
[22.741120202296916,88.45690791649396],[22.740499303078757,88.45681672138558],
[22.739783194572578,88.4567866412132],[22.739523443370576,88.45676496920235],
[22.73899541415657,88.4567733887531],[22.738915174246582,88.45627663479418],
[22.738920351021616,88.45553571362238],[22.738689984570897,88.45492108583082],
[22.738151598531363,88.45498282926397],[22.737571795834103,88.45503895965483],
[22.737466576918642,88.45483592288132],[22.737198269150227,88.45469046494297],
[22.736900614603584,88.45448136915662],[22.73673363926558,88.45441131631574],
[22.736539347989016,88.45444331553794],[22.736340137659298,88.4545153137879],
[22.736332759493365,88.4545259801953],[22.736155683391484,88.45461664465822],
[22.736086820386454,88.45482730621198],[22.736072064026843,88.45512596561923],
[22.735941716114485,88.45524329610065],[22.73582858386341,88.45543529143387],

[22.735596254533178,88.45540027872644],[22.735520484212014,88.45526540588254],

[22.735256745719855,88.45537434208038],[22.735223236122945,88.45581753443597],
[22.735189147428816,88.45601789922841],[22.73499179166422,88.45606458617036],
[22.73481596537944,88.45626689625206],[22.734841657596974,88.45655170734858],
[22.734913861647236,88.45662129551873],[22.734937929655526,88.45683006002926],

];

L.polygon(campusBoundary,{
  color:'#1e3a8a',
  weight:3,
  fillOpacity:0.15
}).addTo(map);

/* =========================
   MARKER
========================= */
const userIcon = L.icon({
  iconUrl:'https://static.vecteezy.com/system/resources/thumbnails/029/166/580/small/icon-location-map-ai-generative-png.png',
  iconSize:[42,42],
  iconAnchor:[21,42]
});

const userMarker = L.marker([22.7378,88.4565],{icon:userIcon}).addTo(map);

/* =========================
   KALMAN FILTER (SAFE)
========================= */
class Kalman1D {
  constructor(r=0.00001, q=0.0003) {
    this.r = r;
    this.q = q;
    this.p = 1;
    this.x = null;
  }
  filter(z) {
    if (this.x === null) {
      this.x = z;
      return z;
    }
    this.p += this.q;
    const k = this.p / (this.p + this.r);
    this.x += k * (z - this.x);
    this.p *= (1 - k);
    return this.x;
  }
}

const kLat = new Kalman1D();
const kLng = new Kalman1D();

/* =========================
   GPS (RAW + KALMAN)
========================= */
navigator.geolocation.watchPosition(
  pos => {
    const rawLat = pos.coords.latitude;
    const rawLng = pos.coords.longitude;
    const acc = Math.round(pos.coords.accuracy);

    const lat = kLat.filter(rawLat);
    const lng = kLng.filter(rawLng);

    userMarker.setLatLng([lat, lng]);

    document.getElementById('status').innerText =
      `Kalman GPS | ±${acc}m`;
  },
  err => {
    document.getElementById('status').innerText =
      `GPS ERROR: ${err.message}`;
  },
  {
    enableHighAccuracy:true,
    maximumAge:0,
    timeout:15000
  }
);
</script>

</body>
</html>
